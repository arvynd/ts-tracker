[project]
name = "ts-tracker"
version = "0.1.0"
description = "Leakage-safe benchmark of time-series foundation models on demand-like data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandera>=0.34.1",
    "pointblank>=1.0.1",
    "polars>=1.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
]

[project.scripts]
ts-tracker = "ts_tracker.cli:main"

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pytest>=8.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
