# Single scope config for data, benchmark and serving.

[scope]
# Balancing authorities in the starting scope: the 8 that report subregions in EIA-930.
bas = ["CISO", "ERCO", "ISNE", "MISO", "NYIS", "PJM", "PNM", "SWPP"]

[forecast]
freq = "weekly"  # weeks run Monday-Sunday UTC; mean MW, 168 hours required
horizons = [1, 2, 4]  # weeks
season_length = 52
# Rolling-origin cutoffs; every one must be after the newest model release date.
cutoffs = []

[paths]
data_dir = "data"
results_dir = "results"
